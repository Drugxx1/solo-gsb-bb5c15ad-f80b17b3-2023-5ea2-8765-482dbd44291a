<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕时间漂移校正</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --border: #d9dee8;
    --text: #1f2733;
    --muted: #6b7686;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warn-bg: #fffbeb;
    --warn-border: #f59e0b;
    --ok-bg: #f0fdf4;
    --ok-border: #16a34a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-weight: 400; font-size: 13px; }
  textarea {
    width: 100%;
    min-height: 220px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.6 var(--mono);
    resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid rgba(37, 99, 235, .35); border-color: var(--primary); }
  table.anchors { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
  table.anchors th {
    text-align: left;
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    padding: 0 8px 0 0;
  }
  table.anchors td { padding: 0; vertical-align: middle; }
  table.anchors td.time { width: 44%; padding-right: 8px; }
  table.anchors td.op { width: 40px; text-align: center; color: var(--muted); }
  table.anchors td.del { width: 44px; text-align: right; }
  input[type="text"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font: 14px var(--mono);
  }
  button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f1f4f9; }
  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 10px 22px;
  }
  button.primary:hover { background: var(--primary-hover); }
  button.danger-link { border-color: transparent; color: var(--danger); padding: 4px 8px; }
  button.danger-link:hover { background: var(--danger-bg); }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .alert {
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .alert.error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  .alert.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: #92400e; }
  .alert.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: #166534; }
  .hidden { display: none; }
  .preview {
    width: 100%;
    min-height: 220px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.6 var(--mono);
    background: #fafbfc;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .cues { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .cues th, .cues td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .cues th { background: #f8fafc; }
  .cues td.num { width: 44px; color: var(--muted); text-align: right; }
  .cues td.tc { font-family: var(--mono); white-space: nowrap; }
  .cues .arrow { color: var(--primary); font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <p class="nav" style="margin:0 0 16px;font-size:14px;"><a href="/placement" style="color:var(--primary);text-decoration:none;">字幕位置规划（按画面遮挡自动选择上下）→</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="/reading-load" style="color:var(--primary);text-decoration:none;">阅读负荷热区（重叠字幕速率叠加）→</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="/terms" style="color:var(--primary);text-decoration:none;">字幕专名统一（别名批量替换）→</a>&nbsp;&nbsp;|&nbsp;&nbsp;<a href="/wrap" style="color:var(--primary);text-decoration:none;">字幕智能断行（列数/行数 DP）→</a></p>
  <h1>字幕时间漂移校正</h1>
  <p class="sub">粘贴 SRT 字幕与多组人工确认的「原时间 / 正确时间」锚点，系统按相邻锚点做分段线性映射，锚点外沿用最近区段斜率。</p>

  <div class="card">
    <label for="srt">原始 SRT 字幕</label>
    <textarea id="srt" placeholder="1&#10;00:00:05,000 --> 00:00:08,000&#10;第一句字幕&#10;&#10;2&#10;00:00:12,000 --> 00:00:15,500&#10;第二句字幕"></textarea>
  </div>

  <div class="card">
    <h2>时间锚点
      <span class="hint">至少 2 组，原时间与正确时间都必须严格递增；时间格式 HH:MM:SS,mmm（毫秒分隔符逗号或句点均可）</span>
    </h2>
    <table class="anchors">
      <thead>
        <tr>
          <th style="width:44%">原时间（字幕上的时间）</th>
          <th style="width:44%">正确时间（人工确认）</th>
          <th style="width:40px"></th>
          <th style="width:44px"></th>
        </tr>
      </thead>
      <tbody id="anchorRows"></tbody>
    </table>
    <div class="toolbar">
      <button type="button" id="addAnchor">+ 添加锚点</button>
      <button type="button" id="fillExample">填入示例</button>
    </div>
  </div>

  <div id="errorBox" class="alert error hidden"></div>
  <div id="warnBox" class="alert warn hidden"></div>

  <div class="toolbar" style="margin-bottom: 20px;">
    <button type="button" class="primary" id="submit">校正时间</button>
    <span class="hint" id="status"></span>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>校正结果</h2>
    <div id="okBox" class="alert ok hidden"></div>
    <div class="toolbar" style="margin-top:0;">
      <button type="button" class="primary" id="download">下载 corrected.srt</button>
    </div>
    <table class="cues">
      <thead>
        <tr>
          <th>#</th>
          <th>原时间轴</th>
          <th></th>
          <th>校正后时间轴</th>
          <th>文本</th>
        </tr>
      </thead>
      <tbody id="cueTable"></tbody>
    </table>
    <h2 style="margin-top:18px;">SRT 预览</h2>
    <pre class="preview" id="preview"></pre>
  </div>
</div>

<script>
(function () {
  const rowsEl = document.getElementById("anchorRows");
  const srtEl = document.getElementById("srt");
  const errorBox = document.getElementById("errorBox");
  const warnBox = document.getElementById("warnBox");
  const resultCard = document.getElementById("resultCard");
  const previewEl = document.getElementById("preview");
  const cueTableEl = document.getElementById("cueTable");
  const okBox = document.getElementById("okBox");
  const statusEl = document.getElementById("status");

  function addRow(original, corrected) {
    const tr = document.createElement("tr");
    tr.innerHTML =
      '<td class="time"><input type="text" class="orig" placeholder="00:01:00,000" spellcheck="false"></td>' +
      '<td class="time"><input type="text" class="corr" placeholder="00:00:58,200" spellcheck="false"></td>' +
      '<td class="op">→</td>' +
      '<td class="del"><button type="button" class="danger-link" title="删除该锚点">删除</button></td>';
    tr.querySelector(".orig").value = original || "";
    tr.querySelector(".corr").value = corrected || "";
    tr.querySelector(".danger-link").addEventListener("click", () => {
      if (rowsEl.children.length > 2) tr.remove();
      else alert("至少需要保留 2 组锚点。");
    });
    rowsEl.appendChild(tr);
  }

  function collectAnchors() {
    const anchors = [];
    for (const tr of rowsEl.querySelectorAll("tr")) {
      anchors.push({
        original: tr.querySelector(".orig").value.trim(),
        corrected: tr.querySelector(".corr").value.trim()
      });
    }
    return anchors;
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
  }
  function clearAlerts() {
    errorBox.classList.add("hidden");
    warnBox.classList.add("hidden");
    okBox.classList.add("hidden");
    errorBox.textContent = "";
    warnBox.textContent = "";
    okBox.textContent = "";
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  // 初始两组空锚点
  addRow();
  addRow();

  document.getElementById("addAnchor").addEventListener("click", () => addRow());

  const EXAMPLE_SRT =
    "1\n00:00:10,000 --> 00:00:13,000\n大家好，欢迎收看本期节目\n\n" +
    "2\n00:00:18,500 --> 00:00:21,800\n今天我们来聊聊时间漂移\n\n" +
    "3\n00:01:05,000 --> 00:01:09,200\n字幕越往后，偏差越大\n\n" +
    "4\n00:02:40,000 --> 00:02:44,500\n这就是典型的线性漂移\n\n" +
    "5\n00:05:00,000 --> 00:05:04,000\n用两组以上锚点即可分段校正\n";

  document.getElementById("fillExample").addEventListener("click", () => {
    srtEl.value = EXAMPLE_SRT;
    rowsEl.innerHTML = "";
    addRow("00:00:10,000", "00:00:08,000");
    addRow("00:02:40,000", "00:02:35,000");
    addRow("00:05:00,000", "00:04:52,000");
    clearAlerts();
    resultCard.classList.add("hidden");
  });

  document.getElementById("submit").addEventListener("click", async () => {
    clearAlerts();
    resultCard.classList.add("hidden");
    statusEl.textContent = "校正中…";

    const anchors = collectAnchors();
    try {
      const resp = await fetch("/api/correct", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ srt: srtEl.value, anchors })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showError((data.detail && data.detail.message) || ("请求失败（HTTP " + resp.status + "）"));
        statusEl.textContent = "";
        return;
      }

      // 页面预览与下载共用同一份服务器返回的 corrected_srt
      window.__correctedSrt = data.corrected_srt;
      previewEl.textContent = window.__correctedSrt;
      cueTableEl.innerHTML = data.cues.map(c =>
        "<tr>" +
        '<td class="num">' + escapeHtml(c.index) + "</td>" +
        '<td class="tc">' + escapeHtml(c.original_start) + "<br>" + escapeHtml(c.original_end) + "</td>" +
        '<td class="arrow">→</td>' +
        '<td class="tc">' + escapeHtml(c.corrected_start) + "<br>" + escapeHtml(c.corrected_end) + "</td>" +
        "<td>" + escapeHtml(c.text).replace(/\n/g, "<br>") + "</td>" +
        "</tr>"
      ).join("");

      if (data.warnings && data.warnings.length) {
        warnBox.textContent = data.warnings.join("\n");
        warnBox.classList.remove("hidden");
      } else {
        okBox.textContent = "共校正 " + data.cues.length + " 条字幕，未发现异常。";
        okBox.classList.remove("hidden");
      }
      resultCard.classList.remove("hidden");
      statusEl.textContent = "";
    } catch (err) {
      showError("请求出错：" + err);
      statusEl.textContent = "";
    }
  });

  document.getElementById("download").addEventListener("click", () => {
    // 预览与下载使用同一份服务器返回：服务端仅替换时间码，
    // 原文件带 BOM 时保留唯一一个 BOM，这里不再额外添加，避免重复。
    const content = window.__correctedSrt || "";
    const blob = new Blob([content], { type: "application/x-subrip;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "corrected.srt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
