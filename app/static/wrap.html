<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕智能断行</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --border: #d9dee8;
    --text: #1f2733;
    --muted: #6b7686;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --warn-bg: #fffbeb;
    --warn-border: #f59e0b;
    --ok-bg: #f0fdf4;
    --ok-border: #16a34a;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 64px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .nav { margin: 0 0 16px; font-size: 14px; }
  .nav a { color: var(--primary); text-decoration: none; margin-right: 16px; }
  .nav a:hover { text-decoration: underline; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .hint { color: var(--muted); font-weight: 400; font-size: 13px; }
  textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.6 var(--mono);
    resize: vertical;
  }
  #srt { min-height: 220px; }
  textarea:focus, input:focus { outline: 2px solid rgba(37, 99, 235, .35); border-color: var(--primary); }
  .params { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-end; }
  .params .field { width: 220px; }
  input[type="number"] {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font: 14px var(--mono);
  }
  button {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #f1f4f9; }
  button.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 600;
    padding: 10px 22px;
  }
  button.primary:hover { background: var(--primary-hover); }
  .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .alert {
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .alert.error { background: var(--danger-bg); border: 1px solid var(--danger); color: var(--danger); }
  .alert.ok { background: var(--ok-bg); border: 1px solid var(--ok-border); color: #166534; }
  .alert.warn { background: var(--warn-bg); border: 1px solid var(--warn-border); color: #92400e; }
  .hidden { display: none; }
  .preview {
    width: 100%;
    min-height: 220px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font: 13px/1.6 var(--mono);
    background: #fafbfc;
    white-space: pre-wrap;
    overflow-x: auto;
  }
  .cues { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  .cues th, .cues td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; vertical-align: top; }
  .cues th { background: #f8fafc; }
  .cues td.num { width: 60px; color: var(--muted); text-align: right; }
  .cues td.status { width: 72px; text-align: center; font-weight: 600; }
  .cues tr.ok td.status { color: #166534; }
  .cues tr.fail { background: var(--danger-bg); }
  .cues tr.fail td.status { color: var(--danger); }
  .cues .line { font-family: var(--mono); }
  .cues .width { color: var(--muted); font-size: 12px; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <p class="nav">
    <a href="/">字幕时间漂移校正</a>
    <a href="/placement">字幕位置规划</a>
    <a href="/reading-load">阅读负荷热区</a>
    <a href="/terms">字幕专名统一</a>
  </p>
  <h1>字幕智能断行</h1>
  <p class="sub">粘贴 SRT，填写每行最大显示列数与每条字幕最多行数。系统把每条正文原有换行与连续空白折成单个空格，
    只在空格与汉字 / 中文标点相邻处断行（英文单词不拆开），用动态规划在限制内最小化各行剩余列数的平方和，
    同分取断点更靠前者，并禁止行首为闭标点、行尾为开标点。排不下的字幕保留原正文并说明原因。</p>

  <div class="card">
    <label for="srt">原始 SRT 字幕</label>
    <textarea id="srt" placeholder="1&#10;00:00:01,000 --> 00:00:04,000&#10;这是一条比较长的中文字幕需要智能断行&#10;&#10;2&#10;00:00:05,000 --> 00:00:08,000&#10;Hello world this is an English subtitle line"></textarea>
  </div>

  <div class="card">
    <h2>断行参数
      <span class="hint">东亚宽 / 全角字符计 2 列，其余可见字符计 1 列，组合字符计 0 列</span>
    </h2>
    <div class="params">
      <div class="field">
        <label for="maxColumns">每行最大显示列数</label>
        <input type="number" id="maxColumns" min="1" step="1" value="42">
      </div>
      <div class="field">
        <label for="maxLines">每条字幕最多行数</label>
        <input type="number" id="maxLines" min="1" step="1" value="2">
      </div>
      <button type="button" id="fillExample">填入示例</button>
    </div>
  </div>

  <div id="errorBox" class="alert error hidden"></div>

  <div class="toolbar" style="margin-bottom: 20px;">
    <button type="button" class="primary" id="submit">智能断行</button>
    <span class="hint" id="status"></span>
  </div>

  <div id="resultCard" class="card hidden">
    <h2>断行结果</h2>
    <div id="okBox" class="alert ok hidden"></div>
    <div id="warnBox" class="alert warn hidden"></div>
    <div class="toolbar" style="margin-top:0;">
      <button type="button" class="primary" id="download">下载 wrapped.srt</button>
    </div>
    <table class="cues">
      <thead>
        <tr>
          <th>输入序号</th>
          <th>SRT 序号</th>
          <th>状态</th>
          <th>断行结果（保留原正文 / 原因）</th>
        </tr>
      </thead>
      <tbody id="cueTable"></tbody>
    </table>
    <h2 style="margin-top:18px;">SRT 预览</h2>
    <pre class="preview" id="preview"></pre>
  </div>
</div>

<script>
(function () {
  const srtEl = document.getElementById("srt");
  const maxColumnsEl = document.getElementById("maxColumns");
  const maxLinesEl = document.getElementById("maxLines");
  const errorBox = document.getElementById("errorBox");
  const resultCard = document.getElementById("resultCard");
  const previewEl = document.getElementById("preview");
  const cueTableEl = document.getElementById("cueTable");
  const okBox = document.getElementById("okBox");
  const warnBox = document.getElementById("warnBox");
  const statusEl = document.getElementById("status");

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.remove("hidden");
  }
  function clearAlerts() {
    errorBox.classList.add("hidden");
    okBox.classList.add("hidden");
    warnBox.classList.add("hidden");
    errorBox.textContent = "";
    okBox.textContent = "";
    warnBox.textContent = "";
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  const EXAMPLE_SRT =
    "1\r\n00:00:01,000 --> 00:00:04,000\r\n这是一条比较长的中文字幕，需要智能断行处理\r\n\r\n" +
    "2\r\n00:00:05,000 --> 00:00:08,500\r\nHello world this is an English subtitle\r\n第二行原有换行也会被折叠\r\n\r\n" +
    "3\r\n00:00:09,000 --> 00:00:11,000\r\nsupercalifragilisticexpialidocious 超长单词排不下会保留原文\r\n";

  document.getElementById("fillExample").addEventListener("click", () => {
    srtEl.value = EXAMPLE_SRT;
    maxColumnsEl.value = 30;
    maxLinesEl.value = 2;
    clearAlerts();
    resultCard.classList.add("hidden");
  });

  document.getElementById("submit").addEventListener("click", async () => {
    clearAlerts();
    resultCard.classList.add("hidden");
    statusEl.textContent = "断行中…";

    const maxColumns = Number(maxColumnsEl.value);
    const maxLines = Number(maxLinesEl.value);
    try {
      const resp = await fetch("/api/wrap", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          srt: srtEl.value,
          max_columns: Number.isFinite(maxColumns) ? maxColumns : maxColumnsEl.value,
          max_lines: Number.isFinite(maxLines) ? maxLines : maxLinesEl.value
        })
      });
      const data = await resp.json();
      if (!resp.ok) {
        showError((data.detail && data.detail.message) || ("请求失败（HTTP " + resp.status + "）"));
        statusEl.textContent = "";
        return;
      }

      // 页面预览与下载共用同一份服务器返回的 wrapped_srt（服务端保留 BOM / 换行风格）
      window.__wrappedSrt = data.wrapped_srt;
      previewEl.textContent = window.__wrappedSrt;
      cueTableEl.innerHTML = data.cues.map(c => {
        const body = c.success
          ? c.lines.map(l =>
              '<span class="line">' + escapeHtml(l.text) + "</span>" +
              '<span class="width">' + l.width + " 列</span>"
            ).join("<br>")
          : '<span class="line">' + escapeHtml(c.original_text).replace(/\n/g, "<br>") + "</span>" +
            '<br><span class="width">原因：' + escapeHtml(c.reason) + "</span>";
        return '<tr class="' + (c.success ? "ok" : "fail") + '">' +
          '<td class="num">' + c.cue_order + "</td>" +
          '<td class="num">' + escapeHtml(c.index) + "</td>" +
          '<td class="status">' + (c.success ? (c.changed ? "已断行" : "无需改") : "排不下") + "</td>" +
          "<td>" + body + "</td>" +
          "</tr>";
      }).join("");

      const summary = "共 " + data.cue_count + " 条字幕：成功 " + data.wrapped_count +
        " 条（其中 " + data.changed_count + " 条正文被改写），排不下 " + data.failed_count + " 条。";
      if (data.failed_count > 0) {
        const detail = data.failures.map(f => "第 " + f.cue_order + " 条：" + f.reason).join("\n");
        warnBox.textContent = summary + "\n排不下的字幕已保留原正文：\n" + detail;
        warnBox.classList.remove("hidden");
      } else {
        okBox.textContent = summary + "序号、时间轴、定位参数、BOM 与原换行风格保持原样。";
        okBox.classList.remove("hidden");
      }
      resultCard.classList.remove("hidden");
      statusEl.textContent = "";
    } catch (err) {
      showError("请求出错：" + err);
      statusEl.textContent = "";
    }
  });

  document.getElementById("download").addEventListener("click", () => {
    // 预览与下载使用同一份服务器返回：只改写成功字幕的正文，
    // 原文件的 BOM / CRLF / LF 均保留，这里不再额外处理，避免重复 BOM。
    const content = window.__wrappedSrt || "";
    const blob = new Blob([content], { type: "application/x-subrip;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "wrapped.srt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });
})();
</script>
</body>
</html>
